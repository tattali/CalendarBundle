name: Code_Checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    environment: main
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            symfony-version: 7.0.*
            stability: prefer-lowest
            minimum-stability: stable
            is-current: false
          - php: '8.3'
            symfony-version: 7.4.*
            stability: prefer-stable
            minimum-stability: stable
            is-current: false
          - php: '8.4'
            symfony-version: 8.1.*
            stability: prefer-stable
            minimum-stability: stable
            is-current: true
          - php: '8.5'
            symfony-version: 8.1.*
            stability: prefer-stable
            minimum-stability: stable
            is-current: false

    name: PHP ${{ matrix.php }} - ${{ matrix.symfony-version }} - ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-packages-${{ matrix.php }}-${{ matrix.symfony-version }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony-version }}
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer config minimum-stability ${{ matrix.minimum-stability }}
          # php-cs-fixer needs symfony/process 7.2+, so it cannot install on the Symfony 7.0 job
          if [ "${{ matrix.is-current }}" != "true" ]; then composer remove --dev --no-update friendsofphp/php-cs-fixer; fi
          composer update --no-interaction --prefer-dist --no-security-blocking --prefer-stable ${{ matrix.stability == 'prefer-lowest' && '--prefer-lowest' || '' }}

      - name: PHP-CS-Fixer
        if: matrix.is-current
        run: vendor/bin/php-cs-fixer fix --ansi -v --dry-run

      - name: PHPStan
        continue-on-error: ${{ !matrix.is-current }}
        run: vendor/bin/phpstan analyse

      - name: Execute tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: vendor/bin/phpunit

      - name: SonarCloud Scan
        if: matrix.is-current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v6
